apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodexpress-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodexpress
  template:
    metadata:
      labels:
        app: foodexpress
    spec:
      containers:
      - name: foodexpress
        image: 19901418/my-jenkins-python-app-ci-cd:latest
        ports:
        - containerPort: 80
